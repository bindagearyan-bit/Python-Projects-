<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FBF7EE;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 340px;
            max-width: 90%;
            text-align: center;
        }
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 42px;
            color: #E07A3F;
            margin: 0 0 4px;
        }
        .subtitle { font-size: 13px; color: #8a8375; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid #ddd3bd;
            background: #FBF7EE;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #E07A3F;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #c9682f; }
        .error { color: #C1272D; font-size: 13px; margin-bottom: 12px; }
        .switch-link { margin-top: 18px; font-size: 13px; color: #8a8375; }
        .switch-link a { color: #E07A3F; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>my to-dos</h1>
        <p class="subtitle">create your account</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Choose a username" required>
            <input type="password" name="password" placeholder="Choose a password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch-link">Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
