<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; }
        h1 { text-align: center; }
        .task-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .task-text { flex: 1; }
        .completed { text-decoration: line-through; color: #888; }
        form.add-form { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📝 To-Do List</h1>

    <form class="add-form" method="POST" action="/add">
        <input type="text" name="task" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
    </form>

    {% for task in tasks %}
    <div class="task-row">
        <input type="checkbox" onclick="window.location.href='/complete/{{ task.id }}'" {% if task.completed %}checked{% endif %}>
        <span class="task-text {% if task.completed %}completed{% endif %}">{{ task.text }}</span>
        <a href="/delete/{{ task.id }}">🗑️</a>
    </div>
    {% else %}
    <p>No tasks yet. Add one above!</p>
    {% endfor %}
</body>
</html>
