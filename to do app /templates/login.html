<!DOCTYPE html>
<html>
<head>
    <title>Login - To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 360px; margin: 100px auto; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; }
        .error { color: #C1272D; font-size: 14px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>📝 Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p>No account? <a href="/signup">Sign up</a></p>
</body>
</html>
