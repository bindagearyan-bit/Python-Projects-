<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>piyush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .name {
            font-size: 12rem;
            font-weight: 700;
            color: #222;
            letter-spacing: 0.05em;
            text-align: center;
            user-select: none;
        }

        @media (max-width: 600px) {
            .name {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>
    <h1 class="name">piyush</h1>
</body>
</html>
