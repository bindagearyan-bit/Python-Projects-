<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Match Ticket · Rock Paper Scissors{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            transition: background 0.3s ease;
        }

        body.dark {
            background: #1C1B1F;
            background-image: radial-gradient(circle at 20% 20%, #2A2830 0%, #1C1B1F 60%);
            color: #F5E9D3;
        }

        body.light {
            background: #ECE1C8;
            background-image: radial-gradient(circle at 20% 20%, #F5E9D3 0%, #ECE1C8 60%);
            color: #1C1B1F;
        }

        /* Top fixed bar */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .icon-btn {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 8px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        body.dark .icon-btn {
            background: rgba(255,255,255,0.1);
            color: #F5E9D3;
            border: 1px solid rgba(245,233,211,0.3);
        }
        body.dark .icon-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        body.light .icon-btn {
            color: #1C1B1F;
            border: 1px solid rgba(28,27,31,0.25);
            background: rgba(0,0,0,0.05);
        }
        body.light .icon-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        /* Main ticket card */
        .ticket {
            width: 420px;
            max-width: 95%;
            padding: 44px 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            animation: slideIn 0.4s ease;
            border-radius: 6px;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body.light .ticket {
            background: #F5E9D3;
            border: 1px solid #c9bb98;
            color: #1C1B1F;
        }

        body.dark .ticket {
            background: #25232A;
            border: 1px solid #3A3742;
            color: #F5E9D3;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ticket side notches */
        .ticket::before, .ticket::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            transition: background 0.3s ease;
        }
        body.dark .ticket::before, body.dark .ticket::after { background: #1C1B1F; }
        body.light .ticket::before, body.light .ticket::after { background: #ECE1C8; }
        .ticket::before { left: -12px; }
        .ticket::after { right: -12px; }

        /* Ticket Header Nav Strip */
        .nav-strip {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px dashed;
            padding-bottom: 12px;
            margin-bottom: 20px;
            gap: 2px;
        }
        body.light .nav-strip { border-color: #c9bb98; }
        body.dark .nav-strip { border-color: #454037; }

        .nav-strip a {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            padding: 4px 6px;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        body.light .nav-strip a { color: #6b6455; }
        body.dark .nav-strip a { color: #A8A090; }

        .nav-strip a:hover {
            color: #C1272D !important;
            background: rgba(193, 39, 45, 0.1);
        }

        .nav-strip a.active {
            color: #F5E9D3 !important;
            background: #C1272D !important;
        }

        .eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: #C1272D;
            text-align: center;
            font-weight: 700;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 34px;
            letter-spacing: 2px;
            text-align: center;
            margin: 4px 0 2px;
            line-height: 1.1;
        }
        body.light h1 { color: #1C1B1F; }
        body.dark h1 { color: #F5E9D3; }

        .player-tag {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            margin-bottom: 20px;
            border-bottom: 1px dashed;
            padding-bottom: 16px;
        }
        body.light .player-tag { color: #6b6455; border-color: #c9bb98; }
        body.dark .player-tag { color: #A8A090; border-color: #454037; }

        h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 16px;
        }
        body.light h3 { color: #1C1B1F; }
        body.dark h3 { color: #F5E9D3; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0;
        }

        button.primary, a.btn-primary {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
            padding: 10px 20px;
            border: none;
            background: #C1272D;
            color: #F5E9D3;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border-radius: 4px;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        button.primary:hover, a.btn-primary:hover { background: #a31f24; }
        button.primary:active, a.btn-primary:active { transform: scale(0.96); }

        /* Choice buttons */
        .choice-btn {
            font-size: 26px;
            padding: 14px 18px;
            background: transparent;
            border: 2px dashed;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        body.light .choice-btn { border-color: #1C1B1F; color: #1C1B1F; }
        body.light .choice-btn:hover { background: rgba(28,27,31,0.08); transform: translateY(-3px); }
        
        body.dark .choice-btn { border-color: #F5E9D3; color: #F5E9D3; }
        body.dark .choice-btn:hover { background: rgba(245,233,211,0.1); transform: translateY(-3px); }

        .choice-btn:active { transform: scale(0.94); }

        /* Streak badge */
        .streak-badge {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #C1272D;
            background: rgba(193, 39, 45, 0.12);
            border: 1px dashed #C1272D;
            padding: 5px 12px;
            border-radius: 20px;
            text-align: center;
            margin: 10px auto;
            display: inline-block;
            animation: pulseStreak 1.8s infinite ease-in-out;
        }

        @keyframes pulseStreak {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="{{ theme if theme else 'light' }}">

    <div class="top-bar">
        <form method="POST" action="/game" style="margin:0;">
            <button class="icon-btn" name="theme" value="{{ 'dark' if session.get('theme') == 'light' or not session.get('theme') else 'light' }}">
                {{ 'DARK MODE' if session.get('theme') == 'light' or not session.get('theme') else 'LIGHT MODE' }}
            </button>
        </form>
    </div>

    <div class="ticket">
        <nav class="nav-strip">
            <a href="/game" class="{{ 'active' if active_page == 'game' else '' }}">PLAY</a>
            <a href="/rules" class="{{ 'active' if active_page == 'rules' else '' }}">RULES</a>
            <a href="/leaderboard" class="{{ 'active' if active_page == 'leaderboard' else '' }}">LEADERBOARD</a>
            <a href="/online" class="{{ 'active' if active_page == 'online' else '' }}">ONLINE</a>
            <a href="/about" class="{{ 'active' if active_page == 'about' else '' }}">ABOUT</a>
        </nav>

        {% block content %}{% endblock %}
    </div>

</body>
</html>
