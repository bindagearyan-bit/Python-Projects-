{% extends "base.html" %}

{% block title %}Admit One · Match Ticket Arena{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        text-align: center;
        padding-top: 10px;
    }

    .sub {
        text-align: center;
        font-size: 13px;
        margin-bottom: 28px;
    }
    body.light .sub { color: #6b6455; }
    body.dark .sub { color: #A8A090; }

    input.login-input {
        width: 100%;
        padding: 14px;
        border: none;
        border-bottom: 2px solid;
        background: transparent;
        font-family: 'Space Mono', monospace;
        font-size: 15px;
        margin-bottom: 24px;
        outline: none;
        text-align: center;
        transition: border-color 0.2s ease;
    }
    body.light input.login-input { color: #1C1B1F; border-color: #1C1B1F; }
    body.dark input.login-input { color: #F5E9D3; border-color: #F5E9D3; }

    input.login-input::placeholder { opacity: 0.6; }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <p class="eyebrow">ADMIT ONE</p>
    <h1>ROCK · PAPER · SCISSOR</h1>
    <p class="sub">Enter your name to take the arena floor</p>
    <form method="POST" action="/">
        <input type="text" name="name" class="login-input" placeholder="YOUR NAME" required autofocus autocomplete="off">
        <button type="submit" class="primary" style="width: 100%;">ENTER THE ARENA</button>
    </form>
</div>
{% endblock %}
