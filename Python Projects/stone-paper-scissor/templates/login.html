{% extends "base.html" %}

{% block title %}Login · Match Ticket Arena{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        text-align: center;
        padding-top: 10px;
    }

    .sub {
        text-align: center;
        font-size: 13px;
        color: #6b6455;
        margin-bottom: 28px;
    }

    input.login-input {
        width: 100%;
        padding: 14px;
        border: none;
        border-bottom: 2px solid #1C1B1F;
        background: transparent;
        font-family: 'Space Mono', monospace;
        font-size: 15px;
        color: #1C1B1F;
        margin-bottom: 24px;
        outline: none;
        text-align: center;
    }

    input.login-input::placeholder { color: #9a9284; }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <p class="eyebrow">ADMIT ONE</p>
    <h1>ROCK · PAPER · SCISSOR</h1>
    <p class="sub">Enter your name to take the arena floor</p>
    <form method="POST" action="/">
        <input type="text" name="name" class="login-input" placeholder="YOUR NAME" required autofocus autocomplete="off">
        <button type="submit" class="primary" style="width: 100%;" onclick="playSound('click')">Enter the Arena</button>
    </form>
</div>
{% endblock %}
