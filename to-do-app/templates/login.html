<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TaskView</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- LAYER B: AMBIENT DIAGONAL GEOMETRIC BANDS -->
    <div class="bg-decorations" aria-hidden="true">
        <div class="bg-band bg-band-1"></div>
        <div class="bg-band bg-band-2"></div>
        <div class="bg-band bg-band-3"></div>
    </div>

    <!-- MAIN FLOATING AUTH CARD -->
    <main class="auth-container-card">
        <div class="auth-inner-box">
            <div class="auth-brand-badge">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>

            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to organize your tasks and daily flow</p>

            {% if error %}
            <div class="auth-error-banner">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="POST" action="/login">
                <div class="auth-input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="auth-input" placeholder="Enter your username" required autofocus>
                </div>

                <div class="auth-input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="auth-submit-btn">Sign In to Dashboard</button>
            </form>

            <div class="auth-switch-text">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
        </div>
    </main>

    <script>
        // Clear any lingering client-side session state
        try { sessionStorage.clear(); } catch(e) {}
    </script>
</body>
</html>
